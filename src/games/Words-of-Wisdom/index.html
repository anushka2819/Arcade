<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Words of Wisdom - Lumina Zen Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: #FDF2F4;
        color: #4A353B;
        min-h: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      h1, h2, h3 { font-family: 'Outfit', sans-serif; }
      .card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
        border: 2px solid #F7C5D1;
        border-radius: 1.5rem;
        padding: 2rem;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(74, 53, 59, 0.08);
        text-align: center;
      }
      .quote-box {
        min-height: 80px;
        background: #FCEBEF;
        border: 2px dashed #F7C5D1;
        border-radius: 1rem;
        padding: 1rem;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        margin: 1.5rem 0;
      }
      .word-btn {
        background: #F7D0D8;
        color: #4A353B;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 0.75rem;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      }
      .word-btn:hover { background: #F7C5D1; transform: translateY(-2px); }
      .word-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
      .placed-word {
        background: #4A353B;
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.75rem;
        font-weight: 700;
        font-size: 0.9rem;
        animation: popIn 0.3s ease;
      }
      @keyframes popIn {
        0% { transform: scale(0.7); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .banner-img {
        width: 100%;
        max-height: 180px;
        object-fit: cover;
        border-radius: 1rem;
        margin-bottom: 1rem;
      }
      .btn-primary {
        background: #4A353B;
        color: white;
        border: none;
        padding: 0.8rem 2rem;
        border-radius: 2rem;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 1rem;
      }
      .btn-primary:hover { background: #37252A; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/1.png" alt="Words of Wisdom" class="banner-img" />
      <h2>📖 Words of Wisdom</h2>
      <p style="color: #A86B79; font-size: 0.85rem; margin-top: 0.25rem;">
        Assemble the scrambled words to unlock peaceful affirmations.
      </p>

      <div class="quote-box" id="placedContainer">
        <span id="placeholderText" style="color: #A86B79; font-style: italic; font-size: 0.85rem;">
          Tap the words below in order...
        </span>
      </div>

      <div id="wordsPool" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;"></div>

      <div id="winOverlay" style="display: none; margin-top: 1rem; padding: 1rem; background: #EADF9E; border-radius: 1rem; color: #4A353B; font-weight: bold;">
        ✨ Quote Completed! Calm Points +100 ✨
        <br />
        <button class="btn-primary" onclick="nextLevel()">Next Affirmation ➔</button>
      </div>
    </div>

    <script>
      const quotes = [
        ["Peace", "begins", "within", "a quiet", "mind."],
        ["Breathe", "deeply", "and", "release", "all tension."],
        ["Every", "step", "forward", "is progress."],
        ["You", "are", "stronger", "than", "your thoughts."]
      ];
      let currentQuoteIndex = 0;
      let placedWords = [];

      function loadQuote() {
        placedWords = [];
        const container = document.getElementById('placedContainer');
        const pool = document.getElementById('wordsPool');
        const winOverlay = document.getElementById('winOverlay');
        
        container.innerHTML = '<span id="placeholderText" style="color: #A86B79; font-style: italic; font-size: 0.85rem;">Tap the words below in order...</span>';
        winOverlay.style.display = 'none';

        const quote = quotes[currentQuoteIndex];
        const shuffled = [...quote].sort(() => Math.random() - 0.5);

        pool.innerHTML = '';
        shuffled.forEach((word, idx) => {
          const btn = document.createElement('button');
          btn.className = 'word-btn';
          btn.innerText = word;
          btn.onclick = () => selectWord(word, btn);
          pool.appendChild(btn);
        });
      }

      function selectWord(word, btn) {
        btn.disabled = true;
        placedWords.push(word);

        const container = document.getElementById('placedContainer');
        const placeholder = document.getElementById('placeholderText');
        if (placeholder) placeholder.remove();

        const badge = document.createElement('span');
        badge.className = 'placed-word';
        badge.innerText = word;
        container.appendChild(badge);

        const currentQuote = quotes[currentQuoteIndex];
        if (placedWords.length === currentQuote.length) {
          if (JSON.stringify(placedWords) === JSON.stringify(currentQuote)) {
            document.getElementById('winOverlay').style.display = 'block';
            if (window.confetti) confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
          } else {
            alert('Not quite right! Resetting this quote...');
            loadQuote();
          }
        }
      }

      function nextLevel() {
        currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
        loadQuote();
      }

      loadQuote();
    </script>
  </body>
</html>
